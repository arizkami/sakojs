[package]
name = "sako"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
sako_http = { path = "crates/sako_http" }
sako_jslib = { path = "crates/sako_jslib" }
sako_npm = { path = "crates/sako_npm" }
sako_pg = { path = "crates/sako_pg" }
sako_typescript = { path = "crates/sako_typescript" }
v8 = "152.2.0"
url = "2.5.8"
regex = "1.13.1"
libc = "0.2"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
