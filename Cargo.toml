[workspace]
members = [
    "crates/sako-accel",
    "crates/sako-cli",
    "crates/sako-diagnostics",
    "crates/sako-http",
    "crates/sako-net",
    "crates/sako-package",
    "crates/sako-platform",
    "crates/sako-process",
    "crates/sako-typescript",
    "crates/sako-v8",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/sako-js/sako"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
