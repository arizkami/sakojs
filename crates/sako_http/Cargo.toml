[package]
name = "sako_http"
version = "0.1.0"
edition = "2024"
description = "HTTP server (hyper, thread per core) and fetch client (ureq) for Sako"

[dependencies]
ureq = "3.4.2"
tokio = { version = "1.53.3", features = ["rt", "net", "sync", "macros"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
socket2 = { version = "0.6.5", features = ["all"] }
