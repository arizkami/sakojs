[package]
name = "sako-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "sako_v8_bridge"
build = "build.rs"

[dependencies]
sako-http = { path = "../sako-http" }
sako-net = { path = "../sako-net" }
sako-postgres = { path = "../sako-postgres" }
sako-process = { path = "../sako-process" }
sako-typescript = { path = "../sako-typescript" }
sha1 = "0.10"
sha2 = "0.10"
ureq = "2.12"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
sako-typescript = { path = "../sako-typescript" }
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sako-diagnostics = { path = "../sako-diagnostics" }
