[package]
name = "sako-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "sako_v8_bridge"
build = "build.rs"

[dependencies]
sako-http = { path = "../sako-http" }
sako-net = { path = "../sako-net" }
sako-process = { path = "../sako-process" }
sako-typescript = { path = "../sako-typescript" }
sha1 = "0.10"
ureq = "2.12"

[target.'cfg(target_os = "linux")'.build-dependencies]
# A build-dependency, not a normal one: sako-v8's build.rs needs its .rlib
# (and its own dependencies') fully compiled with real object code before it
# runs, to pull the temporal_rs_* symbols out of them. Cargo guarantees that
# ordering for build-dependencies but not for normal ones. See
# docs/v8-linkage.md.
sako-temporal-bridge = { path = "../sako-temporal-bridge" }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sako-diagnostics = { path = "../sako-diagnostics" }
