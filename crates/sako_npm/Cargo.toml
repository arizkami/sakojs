[package]
name = "sako_npm"
version = "0.1.0"
edition = "2024"
description = "npm package installer for Sako: registry resolution, global cache, hard-linked node_modules"

[dependencies]
ureq = "3.4.2"
nodejs-semver = "7.0.0"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.1"
sha1_smol = "1.0.1"
base64 = "0.23.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.1"
base64 = "0.23.1"
serde_json = "1.0.154"
